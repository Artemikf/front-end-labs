<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедКонсалт Онлайн — Зворотній зв'язок</title>
</head>
<body>

    <header>
        <img src="images/logo.png" alt="Логотип МедКонсалт Онлайн" width="80" height="80">
        <h1>МедКонсалт Онлайн</h1>
        <nav>
            <a href="index.html"><button type="button">На Головну сторінку</button></a>
            <a href="services.html"><button type="button">Послуги</button></a>
        </nav>
    </header>

    <hr>

    <main>
        <h2>Форма зворотнього зв'язку</h2>
        <p>Заповніть форму нижче, щоб надіслати звернення адміністрації медичного центру.</p>

        <form action="#" method="post">
            <!-- Поля 1, 2 та 3 згруповані, обведені рамкою з легендою «Персональна інформація» -->
            <fieldset>
                <legend>Персональна інформація</legend>

                <p>
                    <label for="fullname">1. Прізвище та ім'я:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="Введіть прізвище та ім'я" required>
                </p>

                <p>
                    <label for="email">2. E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </p>

                <p>
                    <label for="age">3. Вік:</label><br>
                    <input type="number" id="age" name="age" min="1" max="120" placeholder="Вкажіть ваш вік" required>
                </p>
            </fieldset>

            <p>
                <label for="purpose">4. Мета зворотнього зв'язку:</label><br>
                <select id="purpose" name="purpose" required>
                    <option value="cooperation" selected>співпраця</option>
                    <option value="quality_complaint">скарга на якість послуги</option>
                    <option value="suggestion">пропозиція</option>
                    <option value="site_error">наявність помилки на сайті</option>
                </select>
            </p>

            <p>
                <label for="details">5. Детально (максимум 500 символів):</label><br>
                <textarea id="details" name="details" rows="6" cols="50" maxlength="500" placeholder="Опишіть деталі вашого звернення..." required></textarea>
            </p>

            <p>
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Я надаю згоду на обробку персональної інформації</label>
            </p>

            <p>
                <button type="submit">Надіслати інформацію</button>
                <button type="reset">Очистити форму</button>
            </p>
        </form>
    </main>

    <hr>

    <footer>
        <p>Адреса: м. Київ, вул. Володимирська, 60, офіс 305 | Телефон: +38 (044) 234-56-78</p>
    </footer>

</body>
</html>
